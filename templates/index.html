<!DOCTYPE html>
<html>
<head>
    <title>Asset Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Asset List</h2>
    <a href="{{ url_for('add_asset') }}" class="btn btn-primary mb-3">Add Asset</a>
    <a href="{{ url_for('add_users') }}" class="btn btn-primary mb-3">Add Users</a>
    <table class="table table-bordered">
        <thead><tr><th>ID</th><th>Name</th><th>Category</th><th>Value</th><th>Action</th></tr></thead>
        <tbody>
            {% for asset in assets %}
                <tr>
                    <td>{{ asset.id }}</td>
                    <td>{{ asset.name }}</td>
                    <td>{{ asset.category }}</td>
                    <td>${{ asset.value }}</td>                   
                </tr>
            
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
