<!DOCTYPE html>
<html>
<head>
    <title>Add Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Add New Users</h2>
    <form method="POST">
        <div class="mb-3">
            <label>Employee ID:</label>
            <input type="text" name="employeeid" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Employee Name:</label>
            <input type="text" name="employeename" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Employee Email</label>
            <input type="text" name="employeeemail" class="form-control">
        </div>
        <div class="mb-3">
            <label>Employee Phone</label>
            <input type="text" name="employeephone" class="form-control">
        </div>
        <button type="submit" class="btn btn-success">Add User</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Back</a>
    </form>
</body>
</html>
